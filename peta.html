    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // =====================================================================
      // Peta Informasi Geografis Cipurwasari — alat penandaan lapangan
      // =====================================================================

      const kordinatCipurwasari = [-6.522681, 107.201505];

      // --- Sumber peta -----------------------------------------------------

      // Atribusi sengaja diringkas: versi panjang Esri memakan dua baris penuh
      // di layar ponsel, sementara kreditnya tetap tercantum.
      const URL_SATELIT = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";

      const petaSatelit = L.tileLayer(URL_SATELIT, {
        attribution: "Citra &copy; Esri",
        maxZoom: 19,
      });

      const petaJalan = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap",
        maxZoom: 19,
      });

      const map = L.map("map", {
        center: kordinatCipurwasari,
        zoom: 16,
        layers: [petaSatelit],
        zoomControl: false,
        attributionControl: false,
      });

      L.control.attribution({ prefix: false, position: "bottomleft" }).addTo(map);

      L.control.zoom({ position: "topright" }).addTo(map);
      L.control
        .layers(
          {
            "Citra satelit": petaSatelit,
            "Peta jalan": petaJalan,
          },
          null,
          { position: "topright" },
        )
        .addTo(map);

      // =====================================================================
      // Katalog ikon & warna
      // =====================================================================

      const KATALOG_IKON = [
        { id: "trash", fa: "fa-solid fa-trash", label: "Tempat sampah" },
        { id: "recycle", fa: "fa-solid fa-recycle", label: "Daur ulang" },
        { id: "water", fa: "fa-solid fa-droplet", label: "Sumber air" },
        { id: "house", fa: "fa-solid fa-house", label: "Balai desa" },
        { id: "mosque", fa: "fa-solid fa-mosque", label: "Tempat ibadah" },
        { id: "school", fa: "fa-solid fa-school", label: "Sekolah" },
        { id: "health", fa: "fa-solid fa-house-medical", label: "Posyandu / kesehatan" },
        { id: "store", fa: "fa-solid fa-store", label: "Warung / UMKM" },
        { id: "farm", fa: "fa-solid fa-seedling", label: "Lahan pertanian" },
        { id: "tree", fa: "fa-solid fa-tree", label: "Wisata Pegunungan" },
        { id: "road", fa: "fa-solid fa-road", label: "Akses jalan" },
        { id: "people", fa: "fa-solid fa-people-group", label: "Titik kumpul" },
        { id: "warning", fa: "fa-solid fa-triangle-exclamation", label: "Titik rawan" },
        { id: "flag", fa: "fa-solid fa-flag", label: "Lokasi proker" },
        { id: "camera", fa: "fa-solid fa-camera", label: "Titik dokumentasi" },
        { id: "star", fa: "fa-solid fa-star", label: "Penting" },
        { id: "pin", fa: "fa-solid fa-location-dot", label: "Penanda umum" },
        { id: "note", fa: "fa-solid fa-note-sticky", label: "Catatan" },
      ];

      // Warna pekat & jenuh — dipilih agar tetap terbaca di atas citra satelit
      const KATALOG_WARNA = [
        { id: "merah", hex: "#e11d48", label: "Merah" },
        { id: "jingga", hex: "#f97316", label: "Jingga" },
        { id: "kuning", hex: "#facc15", label: "Kuning" },
        { id: "hijau", hex: "#16a34a", label: "Hijau" },
        { id: "tosca", hex: "#06b6d4", label: "Tosca" },
        { id: "biru", hex: "#2563eb", label: "Biru" },
        { id: "ungu", hex: "#7c3aed", label: "Ungu" },
        { id: "pink", hex: "#db2777", label: "Pink" },
        { id: "hitam", hex: "#111827", label: "Hitam" },
        { id: "putih", hex: "#f8fafc", label: "Putih" },
      ];

      // Warna terang perlu ikon gelap supaya tetap terbaca
      const WARNA_TERANG = ["kuning", "putih"];

      const cariIkon = (id) => KATALOG_IKON.find((i) => i.id === id) || KATALOG_IKON[16];
      const cariWarna = (id) => KATALOG_WARNA.find((w) => w.id === id) || KATALOG_WARNA[0];

      const NAMA_JENIS = { pin: "Titik", garis: "Garis", area: "Area" };

      // =====================================================================
      // Status aplikasi
      // =====================================================================

      const KUNCI_SIMPAN = "penanda-cipurwasari-v1";

      const ponsel = () => window.matchMedia("(max-width: 620px)").matches;

      const state = {
        mode: "pin",
        ikon: "trash",
        warna: "merah",
        // Di layar lebar palet muat berdampingan dengan peta; di ponsel palet
        // menutupi separuh peta, jadi disimpan sampai benar-benar dibutuhkan.
        gayaTerbuka: !ponsel(),
        penanda: [], // { id, jenis, koordinat, ikon, warna, nama, catatan, foto }
        titikSementara: [],
      };

      const lapisanPenanda = L.layerGroup().addTo(map);
      const lapisanPratinjau = L.layerGroup().addTo(map);
      const layerById = new Map();

      const idBaru = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

      const $ = (id) => document.getElementById(id);

      // =====================================================================
      // Bentuk visual berkontras tinggi
      // =====================================================================

      function buatIkonPin(item) {
        const ikon = cariIkon(item.ikon);
        const warna = cariWarna(item.warna);
        const terang = WARNA_TERANG.includes(item.warna) ? " is-terang" : "";

        // Lencana kamera menandai penanda berfoto langsung dari peta, tanpa
        // perlu dibuka satu per satu
        const lencanaFoto = item.foto ? '<span class="penanda-foto"><i class="fa-solid fa-camera"></i></span>' : "";

        return L.divIcon({
          className: "penanda",
          html: `<div class="penanda-badge${terang}" style="--warna:${warna.hex}">
                   <i class="${ikon.fa}"></i>
                   ${lencanaFoto}
               </div>
               <div class="penanda-ekor"></div>`,
          iconSize: [36, 46],
          iconAnchor: [18, 44],
          popupAnchor: [0, -42],
        });
      }

      // Garis & area digambar dua lapis: casing putih tebal di bawah, warna di
      // atas. Teknik kartografi standar supaya bentuk tetap terbaca di atas
      // citra satelit apa pun, gelap maupun terang.
      function buatGaris(koordinat, idWarna) {
        const hex = cariWarna(idWarna).hex;
        return L.layerGroup([L.polyline(koordinat, { color: "#ffffff", weight: 9, opacity: 0.92, lineCap: "round", lineJoin: "round" }), L.polyline(koordinat, { color: hex, weight: 5, lineCap: "round", lineJoin: "round" })]);
      }

      function buatArea(koordinat, idWarna) {
        const hex = cariWarna(idWarna).hex;
        return L.layerGroup([L.polygon(koordinat, { color: "#ffffff", weight: 8, opacity: 0.92, fill: false }), L.polygon(koordinat, { color: hex, weight: 4, fillColor: hex, fillOpacity: 0.3 })]);
      }

      const titikPusat = (item) => (item.jenis === "pin" ? item.koordinat : [item.koordinat.reduce((s, k) => s + k[0], 0) / item.koordinat.length, item.koordinat.reduce((s, k) => s + k[1], 0) / item.koordinat.length]);

      const namaTampil = (item) => item.nama || cariIkon(item.ikon).label;

      // =====================================================================
      // Foto dokumentasi
      // =====================================================================

      const FOTO_SISI_MAKS = 1000; // piksel
      const FOTO_MUTU = 0.72;

      // Foto kamera ponsel bisa 3–8 MB, sedangkan localStorage cuma ~5 MB untuk
      // seluruh data. Karena itu setiap gambar diperkecil & dikompres dulu
      // sebelum disimpan — cukup untuk dokumentasi, jauh lebih ringan.
      function kompresGambar(file) {
        return new Promise((selesai, gagal) => {
          if (!file.type.startsWith("image/")) {
            gagal(new Error("Berkas itu bukan gambar."));
            return;
          }

          const pembaca = new FileReader();
          pembaca.onerror = () => gagal(new Error("Gambar gagal dibaca."));
          pembaca.onload = () => {
            const img = new Image();
            img.onerror = () => gagal(new Error("Gambar gagal dibaca."));
            img.onload = () => {
              const skala = Math.min(1, FOTO_SISI_MAKS / Math.max(img.width, img.height));
              const kanvas = document.createElement("canvas");
              kanvas.width = Math.round(img.width * skala);
              kanvas.height = Math.round(img.height * skala);
              kanvas.getContext("2d").drawImage(img, 0, 0, kanvas.width, kanvas.height);
              selesai(kanvas.toDataURL("image/jpeg", FOTO_MUTU));
            };
            img.src = pembaca.result;
          };
          pembaca.readAsDataURL(file);
        });
      }

      // =====================================================================
      // Notifikasi
      // =====================================================================

      function toast(pesan, opsi = {}) {
        const el = document.createElement("div");
        el.className = "toast" + (opsi.gagal ? " toast--gagal" : "");
        el.innerHTML = `<i class="fa-solid ${opsi.gagal ? "fa-circle-exclamation" : "fa-circle-check"}"></i>
                    <span class="toast-pesan"></span>`;
        el.querySelector(".toast-pesan").textContent = pesan;

        if (opsi.batal) {
          const btn = document.createElement("button");
          btn.className = "toast-batal";
          btn.textContent = "Urungkan";
          btn.addEventListener("click", () => {
            opsi.batal();
            tutup();
          });
          el.appendChild(btn);
        }

        $("toasts").appendChild(el);

        const tutup = () => {
          clearTimeout(waktu);
          el.classList.add("is-pergi");
          setTimeout(() => el.remove(), 220);
        };
        const waktu = setTimeout(tutup, opsi.batal ? 6000 : 2800);
      }

      // =====================================================================
      // Popup
      // =====================================================================

      function isiPopup(item) {
        const ikon = cariIkon(item.ikon);
        const warna = cariWarna(item.warna);
        const terang = WARNA_TERANG.includes(item.warna) ? " is-terang" : "";
        const pusat = titikPusat(item);

        const el = document.createElement("div");
        el.className = "pop";
        el.innerHTML = `
        ${
          item.foto
            ? `
        <button class="pop-foto" type="button" title="Lihat foto ukuran penuh">
            <img alt="Foto dokumentasi penanda">
            <span class="pop-foto-lapis"><i class="fa-solid fa-expand"></i> Perbesar</span>
        </button>`
            : ""
        }
        <div class="pop-head">
            <span class="pop-ikon${terang}" style="background:${warna.hex}"><i class="${ikon.fa}"></i></span>
            <span class="pop-judul"></span>
        </div>
        <div class="pop-tags">
            <span class="pop-tag">${NAMA_JENIS[item.jenis]}</span>
            <span class="pop-tag">${ikon.label}</span>
        </div>
        <p class="pop-desc"></p>
        <p class="pop-coord"></p>
        <div class="pop-aksi">
            <button class="btn btn--ghost" data-aksi="ubah"><i class="fa-solid fa-pen"></i> Ubah</button>
            <button class="btn btn--ghost btn--danger" data-aksi="hapus"><i class="fa-solid fa-trash"></i> Hapus</button>
        </div>
    `;

        if (item.foto) {
          el.querySelector(".pop-foto img").src = item.foto;
          el.querySelector(".pop-foto").addEventListener("click", () => bukaLightbox(item));
        }

        // Teks dari pengguna diisi lewat textContent agar tidak pernah
        // diperlakukan sebagai HTML.
        el.querySelector(".pop-judul").textContent = namaTampil(item);

        const desc = el.querySelector(".pop-desc");
        if (item.catatan) desc.textContent = item.catatan;
        else desc.remove();

        el.querySelector(".pop-coord").textContent = `${pusat[0].toFixed(6)}, ${pusat[1].toFixed(6)}`;
        el.querySelector('[data-aksi="ubah"]').addEventListener("click", () => bukaForm(item));
        el.querySelector('[data-aksi="hapus"]').addEventListener("click", () => hapusPenanda(item.id));

        return el;
      }

      function formPopup(item) {
        const el = document.createElement("div");
        el.className = "pop pop-form";
        el.innerHTML = `
        <label class="pop-label" for="fNama">Nama penanda</label>
        <input class="pop-input" id="fNama" maxlength="60" placeholder="Contoh: TPS Dusun Krajan">
        <label class="pop-label" for="fCatatan">Keterangan</label>
        <textarea class="pop-input" id="fCatatan" rows="3" maxlength="400"
                  placeholder="Kondisi lapangan, pengelola, atau catatan survei"></textarea>
        <label class="pop-label">Foto</label>
        <div class="foto-slot" id="fSlot"></div>
        <input type="file" id="fFile" accept="image/*" hidden>
        <div class="pop-aksi">
            <button class="btn btn--ok" data-aksi="simpan"><i class="fa-solid fa-check"></i> Simpan</button>
            <button class="btn btn--ghost" data-aksi="batal">Batal</button>
        </div>
    `;

        const inNama = el.querySelector("#fNama");
        const inCatatan = el.querySelector("#fCatatan");
        const inFile = el.querySelector("#fFile");
        const slot = el.querySelector("#fSlot");
        inNama.value = item.nama || "";
        inCatatan.value = item.catatan || "";

        // Foto disunting di salinan sementara: batal berarti benar-benar batal
        let fotoDraf = item.foto || "";

        function gambarSlot() {
          slot.innerHTML = "";
          if (fotoDraf) {
            const bungkus = document.createElement("div");
            bungkus.className = "foto-preview";
            const img = document.createElement("img");
            img.src = fotoDraf;
            img.alt = "Pratinjau foto";
            const buang = document.createElement("button");
            buang.className = "foto-buang";
            buang.type = "button";
            buang.title = "Buang foto";
            buang.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            buang.addEventListener("click", () => {
              fotoDraf = "";
              gambarSlot();
            });
            bungkus.append(img, buang);
            slot.appendChild(bungkus);
          } else {
            const zona = document.createElement("button");
            zona.className = "foto-zona";
            zona.type = "button";
            zona.innerHTML = `<i class="fa-solid fa-camera"></i>
                              <span>Ambil atau pilih foto</span>`;
            zona.addEventListener("click", () => inFile.click());
            slot.appendChild(zona);
          }
        }

        inFile.addEventListener("change", async () => {
          const file = inFile.files[0];
          if (!file) return;
          slot.innerHTML = '<div class="foto-tunggu"><i class="fa-solid fa-spinner fa-spin"></i> Menyiapkan foto…</div>';
          try {
            fotoDraf = await kompresGambar(file);
          } catch (err) {
            toast(err.message, { gagal: true });
          }
          inFile.value = "";
          gambarSlot();
        });

        gambarSlot();

        const tampilkanDetail = () => {
          const layer = layerById.get(item.id);
          if (layer) layer.setPopupContent(isiPopup(item));
        };

        el.querySelector('[data-aksi="simpan"]').addEventListener("click", () => {
          item.nama = inNama.value.trim();
          item.catatan = inCatatan.value.trim();
          item.foto = fotoDraf;
          simpan();
          gambarUlangDaftar();

          // Lencana kamera pada pin ikut menyesuaikan begitu foto berubah
          const layer = layerById.get(item.id);
          if (item.jenis === "pin") layer?.setIcon(buatIkonPin(item));

          tampilkanDetail();
        });

        el.querySelector('[data-aksi="batal"]').addEventListener("click", tampilkanDetail);

        // Enter di kolom nama menyimpan; Esc menutup popup
        inNama.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            el.querySelector('[data-aksi="simpan"]').click();
          }
        });

        L.DomEvent.disableClickPropagation(el);
        L.DomEvent.disableScrollPropagation(el);
        setTimeout(() => inNama.focus(), 60);
        return el;
      }

      const bukaForm = (item) => {
        const layer = layerById.get(item.id);
        if (layer) layer.setPopupContent(formPopup(item));
      };

      // --- Foto ukuran penuh ---
      function bukaLightbox(item) {
        const el = document.createElement("div");
        el.className = "lightbox";
        el.innerHTML = `
        <button class="lightbox-tutup" title="Tutup (Esc)"><i class="fa-solid fa-xmark"></i></button>
        <figure>
            <img alt="Foto dokumentasi penanda">
            <figcaption></figcaption>
        </figure>
    `;
        el.querySelector("img").src = item.foto;
        el.querySelector("figcaption").textContent = namaTampil(item);

        const tutup = () => {
          el.remove();
          document.removeEventListener("keydown", padaTombol);
        };
        const padaTombol = (e) => {
          if (e.key === "Escape") tutup();
        };

        el.addEventListener("click", (e) => {
          if (e.target === el || e.target.closest(".lightbox-tutup")) tutup();
        });
        document.addEventListener("keydown", padaTombol);
        document.body.appendChild(el);
      }

      // =====================================================================
      // Render penanda
      // =====================================================================

      // Popup harus muat di layar sempit: lebarnya mengikuti jendela dan
      // tingginya dibatasi agar isinya bisa digulir, bukan terpotong.
      const OPSI_POPUP = {
        maxWidth: Math.min(300, window.innerWidth - 48),
        minWidth: Math.min(210, window.innerWidth - 60),
        maxHeight: Math.round(Math.min(330, window.innerHeight * 0.36)),
        closeButton: true,
        autoPanPadding: [14, 60],
      };

      function tambahKePeta(item) {
        let layer;

        if (item.jenis === "pin") {
          layer = L.marker(item.koordinat, {
            icon: buatIkonPin(item),
            draggable: true,
            riseOnHover: true,
          });
          layer.on("dragend", () => {
            const ll = layer.getLatLng();
            item.koordinat = [ll.lat, ll.lng];
            simpan();
            layer.setPopupContent(isiPopup(item));
            toast("Penanda dipindahkan.");
          });
        } else {
          layer = item.jenis === "garis" ? buatGaris(item.koordinat, item.warna) : buatArea(item.koordinat, item.warna);
        }

        layer.bindPopup(isiPopup(item), OPSI_POPUP);
        layer.on("click", (e) => {
          if (state.mode === "hapus") {
            L.DomEvent.stop(e);
            hapusPenanda(item.id);
          }
        });

        layer.addTo(lapisanPenanda);
        layerById.set(item.id, layer);
        return layer;
      }

      function gambarUlangSemua() {
        lapisanPenanda.clearLayers();
        layerById.clear();
        state.penanda.forEach(tambahKePeta);
        gambarUlangDaftar();
      }

      function hapusPenanda(id) {
        const item = state.penanda.find((p) => p.id === id);
        if (!item) return;
        const posisi = state.penanda.indexOf(item);

        const layer = layerById.get(id);
        if (layer) {
          map.closePopup();
          lapisanPenanda.removeLayer(layer);
          layerById.delete(id);
        }
        state.penanda.splice(posisi, 1);
        simpan();
        gambarUlangDaftar();

        toast(`"${namaTampil(item)}" dihapus.`, {
          batal: () => {
            state.penanda.splice(posisi, 0, item);
            simpan();
            gambarUlangSemua();
          },
        });
      }

      function buatPenanda(jenis, koordinat) {
        const item = {
          id: idBaru(),
          jenis,
          koordinat,
          ikon: state.ikon,
          warna: state.warna,
          nama: "",
          catatan: "",
          foto: "",
        };
        state.penanda.push(item);
        const layer = tambahKePeta(item);
        simpan();
        gambarUlangDaftar();

        // Langsung buka formulir supaya penanda bisa diberi nama saat itu juga.
        // Koordinat wajib disuapi: garis & area berupa LayerGroup, dan Leaflet
        // tidak bisa menyimpulkan titik popup dari sebuah grup.
        layer.openPopup(titikPusat(item));
        setTimeout(() => bukaForm(item), 10);
      }

      // =====================================================================
      // Daftar penanda
      // =====================================================================

      const KOSONG = `
    <div class="kosong">
        <div class="kosong-ikon"><i class="fa-solid fa-location-dot"></i></div>
        <p>Belum ada penanda.<br>Klik di peta untuk menandai lokasi pertama.</p>
    </div>`;

      function gambarUlangDaftar() {
        const daftar = $("panelList");
        $("panelCount").textContent = state.penanda.length;
        daftar.innerHTML = "";

        if (state.penanda.length === 0) {
          daftar.innerHTML = KOSONG;
          return;
        }

        state.penanda.forEach((item) => {
          const ikon = cariIkon(item.ikon);
          const warna = cariWarna(item.warna);
          const terang = WARNA_TERANG.includes(item.warna) ? " is-terang" : "";

          const baris = document.createElement("div");
          baris.className = "item";
          baris.innerHTML = `
            <span class="item-dot${terang}" style="background:${warna.hex}"><i class="${ikon.fa}"></i></span>
            <button class="item-teks" type="button" title="Tuju penanda ini di peta">
                <span class="item-nama"></span>
                <span class="item-jenis">
                    ${item.foto ? '<i class="fa-solid fa-camera item-foto-tanda" title="Ada foto"></i>' : ""}
                    ${NAMA_JENIS[item.jenis]} · ${ikon.label}
                </span>
            </button>
            <button class="item-hapus" type="button" title="Hapus penanda"><i class="fa-solid fa-xmark"></i></button>
        `;

          // Tombol teks perlu gaya telanjang; diatur di sini agar CSS tetap ringkas
          const tombolTeks = baris.querySelector(".item-teks");
          tombolTeks.style.cssText = "border:none;background:none;padding:0;text-align:left;min-width:0;flex:1;cursor:pointer;";
          baris.querySelector(".item-nama").textContent = namaTampil(item);

          const layer = () => layerById.get(item.id);

          tombolTeks.addEventListener("click", () => {
            map.flyTo(titikPusat(item), Math.max(map.getZoom(), 17), { duration: 0.6 });
            setTimeout(() => layer()?.openPopup(), 640);
          });

          // Menyorot di daftar juga menyorot pin di peta — menghubungkan
          // kedua tampilan tanpa perlu dijelaskan
          baris.addEventListener("mouseenter", () => {
            const el = layer()?.getElement?.();
            el?.classList.add("is-sorot");
          });
          baris.addEventListener("mouseleave", () => {
            const el = layer()?.getElement?.();
            el?.classList.remove("is-sorot");
          });

          baris.querySelector(".item-hapus").addEventListener("click", () => hapusPenanda(item.id));
          daftar.appendChild(baris);
        });
      }

      // =====================================================================
      // Menggambar garis & area
      // =====================================================================

      const minimalTitik = () => (state.mode === "area" ? 3 : 2);

      function perbaruiPratinjau() {
        lapisanPratinjau.clearLayers();
        const titik = state.titikSementara;

        if (titik.length >= 2) {
          const bentuk = state.mode === "area" && titik.length >= 3 ? buatArea(titik, state.warna) : buatGaris(titik, state.warna);
          bentuk.addTo(lapisanPratinjau);
        }

        titik.forEach((t) =>
          L.circleMarker(t, {
            radius: 6,
            color: "#ffffff",
            weight: 3,
            fillColor: cariWarna(state.warna).hex,
            fillOpacity: 1,
          }).addTo(lapisanPratinjau),
        );

        const kurang = minimalTitik() - titik.length;
        $("drawbar").hidden = titik.length === 0;
        $("drawbarCount").textContent = kurang > 0 ? `${titik.length} titik · butuh ${kurang} lagi` : `${titik.length} titik`;
        $("btnFinish").disabled = kurang > 0;
        $("btnUndoPoint").disabled = titik.length === 0;
      }

      function selesaiGambar() {
        if (state.titikSementara.length < minimalTitik()) return;
        buatPenanda(state.mode, state.titikSementara.slice());
        batalGambar();
      }

      function batalGambar() {
        state.titikSementara = [];
        lapisanPratinjau.clearLayers();
        $("drawbar").hidden = true;
      }

      // =====================================================================
      // Mode & dok alat
      // =====================================================================

      const PETUNJUK = {
        pilih: "Seret untuk menggeser peta. Klik penanda untuk melihat detailnya.",
        pin: "Klik di peta untuk menaruh penanda.",
        garis: "Klik beberapa titik untuk menggambar garis — jalan, sungai, atau rute. Tekan <b>Enter</b> jika sudah.",
        area: "Klik beberapa titik untuk melingkupi area — sawah, batas RW, atau zona rawan. Tekan <b>Enter</b> jika sudah.",
        hapus: "Klik penanda di peta untuk menghapusnya.",
      };

      function gantiMode(mode) {
        if (state.mode !== mode) batalGambar();
        state.mode = mode;

        document.querySelectorAll(".dock-btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));

        const menandai = ["pin", "garis", "area"].includes(mode);
        $("map").classList.toggle("is-menandai", menandai);
        $("map").classList.toggle("is-menghapus", mode === "hapus");
        $("btnGaya").hidden = !menandai;
        $("statusHint").innerHTML = PETUNJUK[mode];
        perbaruiGaya();

        // Zoom klik-ganda hanya mengganggu saat sedang menggambar
        if (mode === "garis" || mode === "area") map.doubleClickZoom.disable();
        else map.doubleClickZoom.enable();
      }

      // Tombol gaya memperlihatkan ikon & warna yang sedang dipakai, sehingga
      // pilihan aktif terbaca tanpa perlu membuka paletnya
      function perbaruiGaya() {
        const menandai = ["pin", "garis", "area"].includes(state.mode);
        const terbuka = menandai && state.gayaTerbuka;

        $("styler").hidden = !terbuka;
        $("btnGaya").setAttribute("aria-pressed", String(terbuka));

        const contoh = $("gayaContoh");
        contoh.style.background = cariWarna(state.warna).hex;
        contoh.classList.toggle("is-terang", WARNA_TERANG.includes(state.warna));
        contoh.innerHTML = `<i class="${cariIkon(state.ikon).fa}"></i>`;
      }

      // Ciutkan/lebarkan dok agar tidak menutupi peta saat tak dipakai
      const dockEl = $("dock");
      const btnMinimize = $("btnMinimize");

      btnMinimize.addEventListener("click", () => {
        const ciut = dockEl.classList.toggle("is-minim");
        btnMinimize.setAttribute("aria-pressed", String(ciut));
        btnMinimize.setAttribute("aria-expanded", String(!ciut));
        btnMinimize.querySelector(".dock-tip").textContent = ciut ? "Lebarkan dok" : "Perkecil dok";

        // Panel ikon & warna berada di luar dok, jadi harus ditutup manual
        // saat dok diciutkan supaya tidak nyangkut kebuka sendiri
        if (ciut && state.gayaTerbuka) {
          state.gayaTerbuka = false;
          perbaruiGaya();
        }
      });

      document.querySelector(".dock").addEventListener("click", (e) => {
        const btn = e.target.closest(".dock-btn");
        if (!btn || btn.id === "btnMinimize") return;

        if (btn.id === "btnGaya") {
          state.gayaTerbuka = !state.gayaTerbuka;
          perbaruiGaya();
        } else {
          gantiMode(btn.dataset.mode);
        }
      });

      // --- Palet ikon ---
      const paletIkon = $("iconPalette");
      KATALOG_IKON.forEach((ikon) => {
        const btn = document.createElement("button");
        btn.className = "icon-btn";
        btn.type = "button";
        btn.dataset.ikon = ikon.id;
        btn.title = ikon.label;
        btn.setAttribute("aria-label", ikon.label);
        btn.setAttribute("aria-pressed", String(ikon.id === state.ikon));
        btn.innerHTML = `<i class="${ikon.fa}"></i>`;
        paletIkon.appendChild(btn);
      });

      paletIkon.addEventListener("click", (e) => {
        const btn = e.target.closest(".icon-btn");
        if (!btn) return;
        state.ikon = btn.dataset.ikon;
        paletIkon.querySelectorAll(".icon-btn").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
        perbaruiGaya();
        // Di ponsel palet menutupi peta, jadi ditutup begitu pilihan dibuat
        if (ponsel()) {
          state.gayaTerbuka = false;
          perbaruiGaya();
        }
      });

      // --- Palet warna ---
      const paletWarna = $("colorPalette");
      KATALOG_WARNA.forEach((warna) => {
        const btn = document.createElement("button");
        btn.className = "swatch";
        btn.type = "button";
        btn.dataset.warna = warna.id;
        btn.title = warna.label;
        btn.setAttribute("aria-label", warna.label);
        btn.setAttribute("aria-pressed", String(warna.id === state.warna));
        btn.style.background = warna.hex;
        paletWarna.appendChild(btn);
      });

      paletWarna.addEventListener("click", (e) => {
        const btn = e.target.closest(".swatch");
        if (!btn) return;
        state.warna = btn.dataset.warna;
        paletWarna.querySelectorAll(".swatch").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
        if (state.titikSementara.length) perbaruiPratinjau();
        perbaruiGaya();
      });

      // =====================================================================
      // Interaksi peta
      // =====================================================================

      map.on("click", (e) => {
        const { lat, lng } = e.latlng;
        if (state.mode === "pin") {
          buatPenanda("pin", [lat, lng]);
        } else if (state.mode === "garis" || state.mode === "area") {
          state.titikSementara.push([lat, lng]);
          perbaruiPratinjau();
        }
      });

      map.on("dblclick", (e) => {
        if (state.mode === "garis" || state.mode === "area") {
          L.DomEvent.stop(e);
          selesaiGambar();
        }
      });

      // Saat popup terbuka, petunjuk mode tidak lagi relevan dan hanya
      // menghalangi — terutama di layar ponsel
      map.on("popupopen", () => document.body.classList.add("popup-terbuka"));
      map.on("popupclose", () => document.body.classList.remove("popup-terbuka"));

      // Pembacaan koordinat langsung — pengganti alat survei di lapangan
      map.on("mousemove", (e) => {
        $("coordText").textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
      });
      map.on("mouseout", () => {
        $("coordText").textContent = "—";
      });

      $("btnFinish").addEventListener("click", selesaiGambar);
      $("btnCancel").addEventListener("click", batalGambar);
      $("btnUndoPoint").addEventListener("click", () => {
        state.titikSementara.pop();
        perbaruiPratinjau();
      });

      // --- Pintasan papan tik ---
      const PINTASAN = { 1: "pilih", 2: "pin", 3: "garis", 4: "area", 5: "hapus" };

      document.addEventListener("keydown", (e) => {
        // Jangan bajak tombol saat pengguna sedang mengetik
        if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;

        if (PINTASAN[e.key]) {
          gantiMode(PINTASAN[e.key]);
        } else if (e.key === "Enter" && state.titikSementara.length) {
          selesaiGambar();
        } else if (e.key === "Escape") {
          if (state.titikSementara.length) batalGambar();
          else map.closePopup();
        }
      });

      // =====================================================================
      // Simpan, muat, ekspor, impor
      // =====================================================================

      function simpan() {
        try {
          localStorage.setItem(KUNCI_SIMPAN, JSON.stringify(state.penanda));
        } catch (err) {
          console.warn("Gagal menyimpan penanda:", err);
          // Foto memakan porsi terbesar, jadi kuota penuh perlu jalan keluar
          // yang konkret — bukan sekadar kabar bahwa penyimpanan gagal.
          const penuh = err.name === "QuotaExceededError" || /quota/i.test(err.message || "");
          toast(penuh ? "Penyimpanan penuh. Ekspor penanda, lalu buang beberapa foto." : "Penanda gagal disimpan di peramban ini.", { gagal: true });
        }
      }

      function muat() {
        try {
          const data = localStorage.getItem(KUNCI_SIMPAN);
          if (!data) return null;
          const hasil = JSON.parse(data);
          return Array.isArray(hasil) ? hasil : null;
        } catch (err) {
          console.warn("Gagal memuat penanda:", err);
          return null;
        }
      }

      // GeoJSON memakai urutan [lng, lat] — kebalikan dari Leaflet [lat, lng]
      function keGeoJSON() {
        return {
          type: "FeatureCollection",
          features: state.penanda.map((item) => {
            let geometry;
            if (item.jenis === "pin") {
              geometry = { type: "Point", coordinates: [item.koordinat[1], item.koordinat[0]] };
            } else if (item.jenis === "garis") {
              geometry = { type: "LineString", coordinates: item.koordinat.map((k) => [k[1], k[0]]) };
            } else {
              const cincin = item.koordinat.map((k) => [k[1], k[0]]);
              cincin.push(cincin[0]); // cincin poligon GeoJSON harus tertutup
              geometry = { type: "Polygon", coordinates: [cincin] };
            }
            return {
              type: "Feature",
              geometry,
              properties: {
                nama: item.nama,
                catatan: item.catatan,
                ikon: item.ikon,
                warna: item.warna,
                foto: item.foto || "",
              },
            };
          }),
        };
      }

      function dariGeoJSON(geo) {
        const hasil = [];
        (geo.features || []).forEach((f) => {
          const g = f.geometry;
          const p = f.properties || {};
          if (!g) return;

          let jenis, koordinat;
          if (g.type === "Point") {
            jenis = "pin";
            koordinat = [g.coordinates[1], g.coordinates[0]];
          } else if (g.type === "LineString") {
            jenis = "garis";
            koordinat = g.coordinates.map((c) => [c[1], c[0]]);
          } else if (g.type === "Polygon") {
            jenis = "area";
            koordinat = g.coordinates[0].slice(0, -1).map((c) => [c[1], c[0]]);
          } else {
            return;
          }

          hasil.push({
            id: idBaru(),
            jenis,
            koordinat,
            ikon: cariIkon(p.ikon).id,
            warna: cariWarna(p.warna).id,
            nama: p.nama || p.name || "",
            catatan: p.catatan || p.description || "",
            // Terima foto hanya bila berupa data URL gambar, bukan tautan luar
            foto: /^data:image\//.test(p.foto || "") ? p.foto : "",
          });
        });
        return hasil;
      }

      $("btnExport").addEventListener("click", () => {
        if (state.penanda.length === 0) {
          toast("Belum ada penanda untuk diekspor.", { gagal: true });
          return;
        }
        const blob = new Blob([JSON.stringify(keGeoJSON(), null, 2)], { type: "application/geo+json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "penanda-cipurwasari.geojson";
        a.click();
        URL.revokeObjectURL(url);
        toast(`${state.penanda.length} penanda diekspor.`);
      });

      $("btnImport").addEventListener("click", () => $("fileInput").click());

      $("fileInput").addEventListener("change", async () => {
        const file = $("fileInput").files[0];
        if (!file) return;
        try {
          const masuk = dariGeoJSON(JSON.parse(await file.text()));
          if (masuk.length === 0) {
            toast("Tidak ada penanda yang terbaca dari file itu.", { gagal: true });
          } else {
            state.penanda.push(...masuk);
            simpan();
            gambarUlangSemua();
            map.fitBounds(
              L.featureGroup([...layerById.values()])
                .getBounds()
                .pad(0.15),
            );
            toast(`${masuk.length} penanda diimpor.`);
          }
        } catch (err) {
          console.warn(err);
          toast("File tidak terbaca. Pastikan formatnya GeoJSON.", { gagal: true });
        }
        $("fileInput").value = "";
      });

      $("btnClear").addEventListener("click", () => {
        if (state.penanda.length === 0) return;
        if (!confirm(`Hapus semua ${state.penanda.length} penanda? Ekspor dulu jika masih dibutuhkan.`)) return;

        const cadangan = state.penanda.slice();
        state.penanda = [];
        simpan();
        gambarUlangSemua();
        toast("Semua penanda dihapus.", {
          batal: () => {
            state.penanda = cadangan;
            simpan();
            gambarUlangSemua();
          },
        });
      });

      // =====================================================================
      // Poster Peta Potensi Desa
      // Foto-foto ditata mengelilingi peta lalu ditarik garis ke titiknya —
      // meniru peta potensi desa yang biasa dicetak dan dipajang di balai desa.
      // Petanya tetap peta Leaflet sungguhan (bukan tangkapan layar), jadi
      // bingkainya bisa diatur dulu sebelum dicetak.
      // =====================================================================

      const MAKS_KARTU = 10; // 5 kartu per kolom — lebih dari itu kolomnya jebol

      const poster = {
        peta: null,
        inset: null,
        kotakInset: null,
        kartu: [], // { item, nomor, el }
        lapisan: null,
      };

      function judulPoster() {
        return {
          judul: localStorage.getItem("poster-judul") || "PETA POTENSI DESA CIPURWASARI",
          sub: localStorage.getItem("poster-sub") || "Kecamatan Tegalwaru, Kabupaten Karawang, Jawa Barat",
          tim: localStorage.getItem("poster-tim") || "KKN Desa Cipurwasari",
        };
      }

      function bukaPoster() {
        if (state.penanda.length === 0) {
          toast("Belum ada penanda. Tandai lokasi dulu, baru posternya bisa dibuat.", { gagal: true });
          return;
        }

        const t = judulPoster();

        // Kolom hanya muat 5 kartu per sisi. Kelebihannya dipangkas, tapi
        // pengguna diberi tahu — poster yang diam-diam membuang foto lebih
        // berbahaya daripada poster yang mengaku memuat sebagian.
        const semuaBerfoto = state.penanda.filter((p) => p.foto);
        const berfoto = semuaBerfoto.slice(0, MAKS_KARTU);
        if (semuaBerfoto.length > MAKS_KARTU) {
          toast(`Poster memuat ${MAKS_KARTU} foto pertama dari ${semuaBerfoto.length}.`);
        }

        const el = document.createElement("div");
        el.className = "poster-layar";
        el.innerHTML = `
        <div class="poster-bar">
            <button class="btn btn--ghost" id="pTutup"><i class="fa-solid fa-arrow-left"></i> Kembali ke peta</button>
            <p class="poster-petunjuk">Geser & zoom petanya untuk mengatur bingkai. Klik judul untuk menggantinya.</p>
            <button class="btn btn--ok" id="pCetak"><i class="fa-solid fa-print"></i> Cetak / simpan PDF</button>
        </div>

        <div class="poster-gulung">
          <div class="poster" id="poster">
            <div class="poster-kiri" id="pKiri"></div>

            <div class="poster-tengah">
                <div class="poster-peta" id="pPeta"></div>
                <svg class="poster-utara" viewBox="0 0 40 56" aria-label="Arah utara">
                    <polygon points="20,4 29,35 20,28 11,35" fill="#22301f"/>
                    <polygon points="20,4 20,28 11,35" fill="#7d8a80"/>
                    <text x="20" y="52" text-anchor="middle" font-size="16" font-weight="700"
                          fill="#22301f" font-family="sans-serif">U</text>
                </svg>
            </div>

            <div class="poster-kanan" id="pKanan"></div>

            <aside class="poster-blok">
                <h2 class="poster-judul" id="pJudul" contenteditable="true" spellcheck="false"></h2>
                <p class="poster-sub" id="pSub" contenteditable="true" spellcheck="false"></p>
                <div class="poster-garis-hias"></div>

                <div class="poster-inset">
                    <div id="pInset"></div>
                    <p class="poster-inset-ket">Peta inset — kotak merah menunjukkan cakupan peta utama</p>
                </div>

                <div class="poster-legenda">
                    <h3>Keterangan</h3>
                    <div id="pLegenda"></div>
                </div>
                <div class="poster-kaki">
                    <p class="poster-sumber">Sumber peta: Citra satelit Esri World Imagery</p>
                    <p class="poster-tim" id="pTim" contenteditable="true" spellcheck="false"></p>
                </div>
            </aside>

            <svg class="poster-tali" id="pTali"></svg>
          </div>
        </div>
    `;
        document.body.appendChild(el);
        document.body.classList.add("mode-poster");

        $("pJudul").textContent = t.judul;
        $("pSub").textContent = t.sub;
        $("pTim").textContent = t.tim;

        // Judul yang disunting ikut tersimpan, supaya tidak perlu diketik ulang
        const simpanTeks = (id, kunci) => $(id).addEventListener("blur", () => localStorage.setItem(kunci, $(id).textContent.trim()));
        simpanTeks("pJudul", "poster-judul");
        simpanTeks("pSub", "poster-sub");
        simpanTeks("pTim", "poster-tim");

        // --- Peta poster: salinan hidup, bukan tangkapan layar ---
        poster.peta = L.map("pPeta", {
          center: map.getCenter(),
          zoom: map.getZoom(),
          zoomControl: false,
          attributionControl: false,
        });
        L.tileLayer(URL_SATELIT, { maxZoom: 19 }).addTo(poster.peta);

        // Skala batang: peta cetak tanpa skala tidak bisa dipakai mengukur apa pun
        L.control.scale({ metric: true, imperial: false, position: "bottomleft", maxWidth: 160 }).addTo(poster.peta);

        poster.lapisan = L.layerGroup().addTo(poster.peta);
        poster.kartu = [];

        // --- Kartu foto: kiri & kanan mengikuti letak aslinya di peta ---
        const pusat = poster.peta.getCenter();
        const kiri = [],
          kanan = [];
        berfoto.forEach((item) => {
          (titikPusat(item)[1] < pusat.lng ? kiri : kanan).push({ item });
        });

        // Yang paling utara ditaruh paling atas, supaya talinya tidak menyilang
        const urut = (a) => a.sort((x, y) => titikPusat(y.item)[0] - titikPusat(x.item)[0]);
        urut(kiri);
        urut(kanan);
        seimbangkan(kiri, kanan);

        // Nomor diberikan setelah tata letaknya pasti: menurun di kolom kiri,
        // lalu lanjut menurun di kolom kanan. Pembaca bisa menyusurinya urut.
        const nomorPer = new Map();
        [...kiri, ...kanan].forEach((k, i) => {
          k.nomor = i + 1;
          nomorPer.set(k.item.id, i + 1);
        });

        kiri.forEach((k) => $("pKiri").appendChild(kartuPoster(k)));
        kanan.forEach((k) => $("pKanan").appendChild(kartuPoster(k)));
        poster.kartu = [...kiri, ...kanan];

        // Penanda digambar setelah nomornya diketahui; nomor itulah yang
        // menautkan kartu foto dengan titiknya di peta
        state.penanda.forEach((item) => {
          if (item.jenis === "pin") {
            L.marker(item.koordinat, {
              icon: ikonPoster(item, nomorPer.get(item.id) || null),
              interactive: false,
            }).addTo(poster.lapisan);
          } else if (item.jenis === "garis") {
            buatGaris(item.koordinat, item.warna).addTo(poster.lapisan);
          } else {
            buatArea(item.koordinat, item.warna).addTo(poster.lapisan);
          }
        });

        gambarLegendaPoster();

        if (berfoto.length === 0) {
          $("pKiri").innerHTML = `<p class="poster-kosong">
            Belum ada penanda berfoto. Tambahkan foto lewat tombol <b>Ubah</b> di penanda,
            dan fotonya akan muncul mengelilingi peta di sini.</p>`;
        }

        // Bingkai peta dipaskan ke penanda, bukan mewarisi zoom peta utama.
        // Kalau tidak, penanda menggerombol jadi satu gumpalan di tengah.
        const semuaTitik = state.penanda.flatMap((p) => (p.jenis === "pin" ? [p.koordinat] : p.koordinat));
        if (semuaTitik.length === 1) {
          poster.peta.setView(semuaTitik[0], 17);
        } else {
          poster.peta.fitBounds(L.latLngBounds(semuaTitik), { padding: [64, 64], maxZoom: 18 });
        }

        // --- Peta inset: menunjukkan cakupan peta utama dalam konteks luas ---
        poster.inset = L.map("pInset", {
          zoomControl: false,
          attributionControl: false,
          dragging: false,
          scrollWheelZoom: false,
          doubleClickZoom: false,
          boxZoom: false,
          keyboard: false,
          touchZoom: false,
        });
        L.tileLayer(URL_SATELIT, { maxZoom: 19 }).addTo(poster.inset);
        poster.kotakInset = L.rectangle(poster.peta.getBounds(), {
          color: "#e11d48",
          weight: 2.5,
          fill: false,
        }).addTo(poster.inset);

        const perbaruiInset = () => {
          poster.kotakInset.setBounds(poster.peta.getBounds());
          poster.inset.setView(poster.peta.getCenter(), Math.max(poster.peta.getZoom() - 4, 7));
        };
        perbaruiInset();

        poster.peta.on("move zoom", gambarTali);
        poster.peta.on("moveend zoomend", () => {
          gambarTali();
          perbaruiInset();
        });
        window.addEventListener("resize", gambarTali);
        setTimeout(gambarTali, 400);

        $("pTutup").addEventListener("click", tutupPoster);
        $("pCetak").addEventListener("click", () => window.print());
        document.addEventListener("keydown", posterKeydown);
      }

      // Kolom dijaga seimbang: satu sisi menumpuk penuh sementara sisi lain
      // kosong akan membuat talinya menyilang jauh
      function seimbangkan(kiri, kanan) {
        while (kiri.length - kanan.length > 1) kanan.unshift(kiri.pop());
        while (kanan.length - kiri.length > 1) kiri.push(kanan.shift());
      }

      function ikonPoster(item, nomor) {
        const ikon = cariIkon(item.ikon);
        const warna = cariWarna(item.warna);
        const terang = WARNA_TERANG.includes(item.warna) ? " is-terang" : "";
        const label = nomor ? `<span class="pp-nomor">${nomor}</span>` : "";

        return L.divIcon({
          className: "penanda pp-penanda",
          html: `<div class="penanda-badge${terang}" style="--warna:${warna.hex}">
                   <i class="${ikon.fa}"></i>${label}
               </div>
               <div class="penanda-ekor"></div>`,
          iconSize: [32, 42],
          iconAnchor: [16, 40],
        });
      }

      function kartuPoster(kartu) {
        const { item, nomor } = kartu;
        const el = document.createElement("figure");
        el.className = "pp-kartu";
        el.innerHTML = `
        <span class="pp-kartu-nomor">${nomor}</span>
        <img alt="">
        <figcaption></figcaption>
    `;
        el.querySelector("img").src = item.foto;
        el.querySelector("img").alt = namaTampil(item);
        el.querySelector("figcaption").textContent = namaTampil(item);
        kartu.el = el;
        return el;
      }

      function gambarLegendaPoster() {
        const wadah = $("pLegenda");
        wadah.innerHTML = "";

        // Legenda dikelompokkan per jenis ikon yang benar-benar dipakai —
        // bukan daftar semua ikon yang tersedia
        const dipakai = new Map();
        state.penanda.forEach((p) => {
          const kunci = p.ikon + "|" + p.warna;
          if (!dipakai.has(kunci)) dipakai.set(kunci, { ikon: p.ikon, warna: p.warna, jumlah: 0 });
          dipakai.get(kunci).jumlah++;
        });

        dipakai.forEach((g) => {
          const ikon = cariIkon(g.ikon);
          const warna = cariWarna(g.warna);
          const terang = WARNA_TERANG.includes(g.warna) ? " is-terang" : "";
          const baris = document.createElement("div");
          baris.className = "pp-legenda-baris";
          baris.innerHTML = `
            <span class="pp-legenda-dot${terang}" style="background:${warna.hex}"><i class="${ikon.fa}"></i></span>
            <span class="pp-legenda-teks">${ikon.label}</span>
            <span class="pp-legenda-jumlah">${g.jumlah}</span>
        `;
          wadah.appendChild(baris);
        });
      }

      // Tali penghubung: dari tepi dalam kartu ke titiknya di peta
      function gambarTali() {
        const svg = $("pTali");
        if (!svg || !poster.peta) return;

        const bingkai = $("poster").getBoundingClientRect();
        svg.setAttribute("viewBox", `0 0 ${bingkai.width} ${bingkai.height}`);
        svg.innerHTML = "";

        const kotakPeta = $("pPeta").getBoundingClientRect();
        const jalur = [];

        poster.kartu.forEach((kartu) => {
          if (!kartu.el) return;
          const kk = kartu.el.getBoundingClientRect();
          const kiri = kk.left < bingkai.left + bingkai.width / 2;

          const x1 = (kiri ? kk.right : kk.left) - bingkai.left;
          const y1 = kk.top + kk.height / 2 - bingkai.top;

          const p = poster.peta.latLngToContainerPoint(titikPusat(kartu.item));
          const x2 = kotakPeta.left - bingkai.left + p.x;
          const y2 = kotakPeta.top - bingkai.top + p.y;

          // Titik di luar bingkai peta tidak digambar talinya — garis yang
          // menunjuk ke luar peta hanya membingungkan
          if (p.x < 0 || p.y < 0 || p.x > kotakPeta.width || p.y > kotakPeta.height) return;

          // Siku, bukan garis miring: mengikuti gaya peta potensi cetak
          const xTekuk = kiri ? x1 + (x2 - x1) * 0.45 : x1 - (x1 - x2) * 0.45;
          jalur.push({ d: `M ${x1} ${y1} L ${xTekuk} ${y1} L ${xTekuk} ${y2} L ${x2} ${y2}`, x2, y2 });
        });

        // Dua babak, bukan per tali. Kalau tiap tali digambar putih-lalu-gelap
        // secara berurutan, lapisan putih tali berikutnya menghapus garis gelap
        // tali sebelumnya di ruas yang berimpit.
        const bagian = [jalur.map((j) => `<path d="${j.d}" class="pp-tali-bawah" />`), jalur.map((j) => `<path d="${j.d}" class="pp-tali" />`), jalur.map((j) => `<circle cx="${j.x2}" cy="${j.y2}" r="3" class="pp-tali-titik" />`)];
        svg.insertAdjacentHTML("beforeend", bagian.flat().join(""));
      }

      function posterKeydown(e) {
        if (e.key === "Escape" && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) && !document.activeElement?.isContentEditable) {
          tutupPoster();
        }
      }

      function tutupPoster() {
        poster.peta?.remove();
        poster.inset?.remove();
        poster.peta = null;
        poster.inset = null;
        poster.kartu = [];
        document.querySelector(".poster-layar")?.remove();
        document.body.classList.remove("mode-poster");
        window.removeEventListener("resize", gambarTali);
        document.removeEventListener("keydown", posterKeydown);
        map.invalidateSize();
      }

      $("btnPoster").addEventListener("click", bukaPoster);

      // =====================================================================
      // Data awal
      // =====================================================================

      const PENANDA_BAWAAN = [
        {
          id: idBaru(),
          jenis: "pin",
          koordinat: kordinatCipurwasari,
          ikon: "trash",
          warna: "merah",
          nama: "Tempat Sampah Cipurwasari",
          catatan: "Tempat pembuangan sampah terpilah hasil program kerja KKN, untuk mengurangi kebiasaan warga membuang sampah di aliran sungai. Dikelola bersama warga RT/RW setempat.",
        },
      ];

      state.penanda = muat() || PENANDA_BAWAAN;
      gambarUlangSemua();
      gantiMode("pin"); // Buka halaman, langsung bisa klik & tandai
      perbaruiPratinjau();

      const toggle = document.getElementById("navToggle");
      const list = document.getElementById("navList");
      toggle.addEventListener("click", () => list.classList.toggle("open"));
      list.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => list.classList.remove("open")));

      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) e.target.classList.add("in");
          });
        },
        { threshold: 0.15 },
      );
      document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
    </script>
  </body>
</html>
