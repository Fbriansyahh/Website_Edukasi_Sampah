<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peta Satelit Cipurwasari — Karawang</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
      /* =====================================================================
   Peta Informasi Geografis Cipurwasari
   Arah desain: alat survei lapangan — peta jadi kanvas, antarmuka
   mengambang di atasnya dengan warna gelap agar tidak melawan citra.
   ===================================================================== */

      :root {
        /* Warna */
        --tinta: #000000; /* hijau-hitam: panel mengambang & teks utama */
        --kanopi: #10381f; /* hijau tua: header */
        --daun: #1fa856; /* hijau aksi utama */
        --daun-tua: #17803f;
        --padi: #f5c518; /* aksen sorot */
        --bata: #dc2626; /* aksi merusak */
        --kabut: #eef2ef; /* latar halaman */
        --kertas: #ffffff;
        --garis: #dde5e0;
        --batu: #6b7d72; /* teks sekunder */
        --batu-muda: #9aa8a0;

        /* Huruf */
        --f-display: "Bricolage Grotesque", "Segoe UI", sans-serif;
        --f-teks: "Public Sans", "Segoe UI", sans-serif;
        --f-data: "JetBrains Mono", ui-monospace, monospace;

        /* Bentuk */
        --r-kecil: 8px;
        --r-sedang: 12px;
        --r-besar: 18px;
        --bayang-ambang: 0 8px 30px rgba(6, 20, 12, 0.35);
        --bayang-kartu: 0 2px 10px rgba(13, 25, 18, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      /* Panel mengambang memakai display:flex, yang mengalahkan atribut
   [hidden] bawaan peramban. Kembalikan prioritasnya. */
      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        font-family: var(--f-teks);
        color: var(--tinta);
        background: var(--kabut);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        padding-top: 72px;
      }

      button {
        font-family: inherit;
        cursor: pointer;
      }

      :focus-visible {
        outline: 2.5px solid var(--padi);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* =========================
   NAVBAR
========================= */

      nav.navbar-custom {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        background: #10381f;
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(242, 236, 221, 0.18);
        padding: 16px 0;
      }

      .navbar-custom .container {
        max-width: 1180px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        position: relative;
      }

      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Fraunces", serif;
        font-size: 1.15rem;
        font-weight: 600;
        color: #fff;
        text-decoration: none;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
      }

      .navbar-nav {
        display: flex;
        gap: 28px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .navbar-nav .nav-link {
        color: #fff;
        font-size: 0.9rem;
        font-weight: 500;
        opacity: 0.85;
        text-decoration: none;
        transition: 0.2s;
      }

      .navbar-nav .nav-link:hover {
        color: #fff;
        opacity: 1;
      }

      .nav-toggle {
        display: none;
        flex-direction: column;
        gap: 5px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
      }

      .nav-toggle span {
        width: 24px;
        height: 2px;
        background: #fff;
        border-radius: 10px;
      }

      /* =========================
   MOBILE
========================= */

      @media (max-width: 820px) {
        .nav-toggle {
          display: flex;
          z-index: 10001;
        }

        .navbar-nav {
          position: absolute;

          top: calc(100% + 16px);

          left: 0;

          right: 0;

          background: rgba(31, 59, 44, 0.98);

          backdrop-filter: blur(8px);

          display: flex;

          flex-direction: column;

          gap: 0;

          max-height: 0;

          overflow: hidden;

          transition: max-height 0.35s ease;

          border-radius: 0 0 14px 14px;

          box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);

          z-index: 10000;
        }

        .navbar-nav.open {
          max-height: 350px;
        }

        .navbar-nav .nav-link {
          display: block;

          padding: 16px 24px;

          color: #fff;

          border-top: 1px solid rgba(255, 255, 255, 0.12);
        }
      }

      /* =====================================================================
   Header
   ===================================================================== */

      .topbar {
        background: var(--kanopi);
        color: #ffffff;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: rgba(255, 255, 255, 0.85);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
        padding: 8px 14px;
        border-radius: 999px;
        transition:
          background 0.15s,
          color 0.15s;
        flex-shrink: 0;
      }

      .back:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
      }

      .back i {
        font-size: 11px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }

      .brand-eyebrow {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--padi);
      }

      .brand h1 {
        font-family: var(--f-display);
        font-size: 23px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
        line-height: 1.1;
        white-space: nowrap;
      }

      .topbar-meta {
        margin: 0 0 0 auto;
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.65);
        display: flex;
        gap: 8px;
        white-space: nowrap;
      }

      .topbar-meta span {
        color: rgba(255, 255, 255, 0.3);
      }

      /* =====================================================================
   Ruang kerja: peta + panel
   ===================================================================== */

      .workspace {
        display: grid;
        grid-template-columns: 1fr 288px;
        gap: 16px;
        padding: 16px;
        height: calc(100vh - 66px);
      }

      .stage {
        position: relative;
        border-radius: var(--r-besar);
        overflow: hidden;
        box-shadow: var(--bayang-kartu);
        background: #cfd8d2;
      }

      #map {
        position: absolute;
        inset: 0;
        background: #cfd8d2;
      }

      /* Kursor bidik menegaskan peta sedang siap ditandai */
      #map.is-menandai,
      #map.is-menandai .leaflet-grab,
      #map.is-menandai .leaflet-interactive {
        cursor: crosshair;
      }

      #map.is-menghapus,
      #map.is-menghapus .leaflet-grab {
        cursor: default;
      }

      #map.is-menghapus .leaflet-marker-icon,
      #map.is-menghapus .leaflet-interactive {
        cursor: pointer;
      }

      /* Kontrol bawaan Leaflet diselaraskan dengan bahasa desain di sini */
      .leaflet-control-layers,
      .leaflet-control-zoom {
        border: none !important;
        border-radius: var(--r-sedang) !important;
        box-shadow: var(--bayang-ambang) !important;
        overflow: hidden;
      }

      .leaflet-control-zoom a {
        background: rgba(13, 25, 18, 0.92) !important;
        color: #ffffff !important;
        border-bottom-color: rgba(255, 255, 255, 0.1) !important;
        font-weight: 400;
      }

      .leaflet-control-zoom a:hover {
        background: rgba(31, 168, 86, 0.95) !important;
      }

      .leaflet-control-layers-toggle {
        background-color: rgba(13, 25, 18, 0.92) !important;
        filter: invert(1) hue-rotate(180deg);
      }

      .leaflet-control-layers-expanded {
        background: rgba(13, 25, 18, 0.94) !important;
        backdrop-filter: blur(10px);
        color: #e8efea;
        padding: 12px 14px !important;
        font-family: var(--f-teks);
        font-size: 12.5px;
      }

      .leaflet-control-attribution {
        font-size: 10px !important;
        background: rgba(255, 255, 255, 0.7) !important;
      }

      /* =====================================================================
   Dok alat
   ===================================================================== */

      .dock {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px;
        background: rgba(13, 25, 18, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        box-shadow: var(--bayang-ambang);
      }

      .dock-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow: hidden;
      }

      /* Tombol perkecil/perbesar duduk di puncak dok, dipisah dari alat lain */
      .dock-toggle {
        color: rgba(255, 255, 255, 0.45);
        margin-bottom: 2px;
      }

      .dock-toggle:hover {
        color: #ffffff;
      }

      .dock-toggle i {
        transition: transform 0.2s ease;
      }

      /* Saat diciutkan: sembunyikan seluruh alat, sisakan tombol perkecil saja */
      .dock.is-minim .dock-body {
        display: none;
      }

      .dock.is-minim .dock-toggle {
        margin-bottom: 0;
      }

      .dock.is-minim .dock-toggle i {
        transform: rotate(180deg);
      }

      .dock-sep {
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        margin: 2px 4px;
      }

      .dock-btn {
        position: relative;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.62);
        border-radius: 10px;
        font-size: 15px;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.15s;
      }

      .dock-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
      }

      .dock-btn[aria-pressed="true"] {
        background: var(--daun);
        color: #ffffff;
        box-shadow: 0 2px 10px rgba(31, 168, 86, 0.45);
      }

      .dock-btn--danger[aria-pressed="true"] {
        background: var(--bata);
        box-shadow: 0 2px 10px rgba(220, 38, 38, 0.45);
      }

      /* Tombol gaya memakai contoh warna & ikon yang sedang dipakai, bukan
   ikon generik — pilihan aktif terbaca tanpa membuka paletnya */
      .dock-gaya[aria-pressed="true"] {
        background: rgba(255, 255, 255, 0.14);
        box-shadow: none;
      }

      .gaya-contoh {
        width: 25px;
        height: 25px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-size: 10.5px;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85);
      }

      .gaya-contoh.is-terang {
        color: var(--tinta);
      }

      /* Tooltip: menerangkan alat sekaligus mengajarkan pintasan papan tik */
      .dock-tip {
        position: absolute;
        left: calc(100% + 10px);
        top: 50%;
        transform: translateY(-50%) translateX(-4px);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 10px;
        background: var(--tinta);
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        border-radius: var(--r-kecil);
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 0.15s,
          transform 0.15s;
        box-shadow: var(--bayang-ambang);
      }

      .dock-btn:hover .dock-tip,
      .dock-btn:focus-visible .dock-tip {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }

      kbd {
        font-family: var(--f-data);
        font-size: 10px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        padding: 1px 5px;
      }

      /* =====================================================================
   Pemilih gaya penanda
   ===================================================================== */

      .styler {
        position: absolute;
        top: 14px;
        left: 68px;
        z-index: 1000;
        width: 208px;
        padding: 12px;
        background: rgba(13, 25, 18, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        box-shadow: var(--bayang-ambang);
        animation: masuk 0.18s ease-out;
      }

      @keyframes masuk {
        from {
          opacity: 0;
          transform: translateX(-8px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .styler-label {
        margin: 0 0 7px 0;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
      }

      .styler-label + * + .styler-label {
        margin-top: 12px;
      }

      .icon-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 3px;
      }

      .icon-btn {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border: none;
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.6);
        border-radius: 7px;
        font-size: 11.5px;
        transition:
          background 0.12s,
          color 0.12s;
      }

      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.16);
        color: #ffffff;
      }

      .icon-btn[aria-pressed="true"] {
        background: #ffffff;
        color: var(--tinta);
      }

      .color-row {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 3px;
      }

      .swatch {
        aspect-ratio: 1;
        border-radius: 50%;
        border: none;
        padding: 0;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }

      .swatch:hover {
        transform: scale(1.2);
      }

      .swatch[aria-pressed="true"] {
        box-shadow:
          0 0 0 2px var(--tinta),
          0 0 0 3.5px #ffffff;
        transform: scale(1.1);
      }

      /* =====================================================================
   Bar menggambar & status
   ===================================================================== */

      .drawbar {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 8px 7px 14px;
        background: rgba(13, 25, 18, 0.92);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        box-shadow: var(--bayang-ambang);
        animation: turun 0.18s ease-out;
      }

      @keyframes turun {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      .drawbar-count {
        font-family: var(--f-data);
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.75);
        margin-right: 4px;
        white-space: nowrap;
      }

      .statusbar {
        position: absolute;
        left: 14px;
        bottom: 26px; /* menyisakan ruang untuk atribusi Leaflet */
        right: 14px;
        z-index: 900;
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: none;
        transition: opacity 0.15s;
      }

      /* Popup terbuka: petunjuk mode sudah tidak relevan dan hanya menghalangi */
      body.popup-terbuka .statusbar {
        opacity: 0;
      }

      .status-hint,
      .status-coord {
        margin: 0;
        padding: 7px 13px;
        background: rgba(13, 25, 18, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.8);
        box-shadow: 0 4px 16px rgba(6, 20, 12, 0.25);
      }

      .status-hint b {
        color: #ffffff;
      }

      .status-coord {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 7px;
        font-family: var(--f-data);
        font-size: 11px;
        letter-spacing: -0.02em;
      }

      .status-coord i {
        color: var(--padi);
        font-size: 10px;
      }

      /* =====================================================================
   Penanda — kontras tinggi di atas citra satelit
   Resepnya: warna pekat + cincin putih tebal + bayangan.
   Kombinasi itu tetap terbaca di atas latar gelap maupun terang.
   ===================================================================== */

      .penanda {
        background: none;
        border: none;
      }

      .penanda-badge {
        position: relative;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--warna);
        border: 3px solid #ffffff;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-size: 14px;
        box-shadow:
          0 3px 12px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(0, 0, 0, 0.3);
        transition: transform 0.15s ease-out;
      }

      /* Warna terang butuh ikon gelap agar tetap terbaca */
      .penanda-badge.is-terang {
        color: #0d1912;
      }

      /* Lencana kamera: penanda berfoto langsung terbaca dari peta */
      .penanda-foto {
        position: absolute;
        right: -4px;
        bottom: -3px;
        width: 16px;
        height: 16px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #ffffff;
        color: var(--tinta);
        font-size: 7.5px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      }

      .penanda-ekor {
        width: 0;
        height: 0;
        margin: -3px auto 0 auto;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 10px solid #ffffff;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.45));
      }

      .penanda:hover .penanda-badge,
      .penanda.is-sorot .penanda-badge {
        transform: scale(1.18) translateY(-3px);
      }

      .penanda.is-sorot .penanda-badge {
        box-shadow:
          0 3px 12px rgba(0, 0, 0, 0.5),
          0 0 0 4px rgba(245, 197, 24, 0.9);
      }

      /* =====================================================================
   Popup
   ===================================================================== */

      .leaflet-popup-content-wrapper {
        border-radius: var(--r-sedang) !important;
        box-shadow: var(--bayang-ambang) !important;
        padding: 4px !important;
      }

      .leaflet-popup-content {
        margin: 10px 12px !important;
        font-family: var(--f-teks);
      }

      .pop {
        min-width: 200px;
      }

      /* Foto memenuhi lebar popup: margin negatif melawan padding bawaan
   Leaflet, sehingga gambar mentok ke tepi seperti kartu berfoto */
      .pop-foto {
        position: relative;
        display: block;
        width: calc(100% + 24px);
        margin: -10px -12px 11px -12px;
        padding: 0;
        border: none;
        border-radius: 10px 10px 0 0;
        overflow: hidden;
        background: #e4eae6;
        cursor: zoom-in;
      }

      .pop-foto img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        transition: transform 0.35s ease-out;
      }

      .pop-foto:hover img {
        transform: scale(1.05);
      }

      /* Lapisan "Perbesar" hanya muncul saat disentuh kursor — foto tetap
   jadi bintangnya, petunjuknya datang saat dibutuhkan */
      .pop-foto-lapis {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        gap: 5px;
        padding: 9px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #ffffff;
        background: linear-gradient(to top, rgba(6, 14, 10, 0.62), rgba(6, 14, 10, 0) 55%);
        opacity: 0;
        transition: opacity 0.18s;
      }

      .pop-foto:hover .pop-foto-lapis,
      .pop-foto:focus-visible .pop-foto-lapis {
        opacity: 1;
      }

      .pop-foto-lapis i {
        font-size: 10px;
      }

      .pop-head {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .pop-ikon {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-size: 12px;
        flex-shrink: 0;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
      }

      .pop-ikon.is-terang {
        color: var(--tinta);
      }

      .pop-judul {
        font-family: var(--f-display);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--tinta);
        line-height: 1.25;
      }

      .pop-tags {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-top: 9px;
      }

      .pop-tag {
        background: #e9f7ee;
        color: var(--daun-tua);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 999px;
      }

      .pop-desc {
        margin: 9px 0 0 0;
        font-size: 12.5px;
        line-height: 1.55;
        color: #46564c;
      }

      .pop-coord {
        margin: 9px 0 0 0;
        font-family: var(--f-data);
        font-size: 10.5px;
        color: var(--batu-muda);
      }

      .pop-aksi {
        display: flex;
        gap: 6px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--garis);
      }

      /* --- Formulir di dalam popup --- */
      .pop-form .pop-label {
        display: block;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--batu-muda);
        margin-bottom: 5px;
      }

      .pop-input {
        width: 100%;
        border: 1.5px solid var(--garis);
        border-radius: var(--r-kecil);
        padding: 8px 10px;
        font-family: var(--f-teks);
        font-size: 13px;
        color: var(--tinta);
        margin-bottom: 10px;
        background: #fbfcfb;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .pop-input:focus {
        outline: none;
        border-color: var(--daun);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(31, 168, 86, 0.14);
      }

      textarea.pop-input {
        resize: vertical;
        line-height: 1.5;
        min-height: 62px;
      }

      /* --- Foto di dalam formulir --- */
      .foto-slot {
        margin-bottom: 10px;
      }

      .foto-zona {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px;
        border: 1.5px dashed var(--garis);
        border-radius: var(--r-kecil);
        background: #fbfcfb;
        color: var(--batu);
        font-size: 12.5px;
        font-weight: 600;
        transition:
          border-color 0.15s,
          background 0.15s,
          color 0.15s;
      }

      .foto-zona:hover {
        border-color: var(--daun);
        background: #f2fbf5;
        color: var(--daun-tua);
      }

      .foto-zona i {
        font-size: 14px;
      }

      .foto-tunggu {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 16px;
        border-radius: var(--r-kecil);
        background: #f1f4f2;
        color: var(--batu);
        font-size: 12.5px;
        font-weight: 600;
      }

      .foto-preview {
        position: relative;
        border-radius: var(--r-kecil);
        overflow: hidden;
        background: #eef2ef;
      }

      .foto-preview img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }

      .foto-buang {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border: none;
        border-radius: 50%;
        background: rgba(13, 25, 18, 0.78);
        backdrop-filter: blur(4px);
        color: #ffffff;
        font-size: 11px;
        transition: background 0.15s;
      }

      .foto-buang:hover {
        background: var(--bata);
      }

      /* =====================================================================
   Foto ukuran penuh
   ===================================================================== */

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        padding: 32px;
        background: rgba(6, 14, 10, 0.88);
        backdrop-filter: blur(6px);
        animation: pudar-masuk 0.18s ease-out;
        cursor: zoom-out;
      }

      @keyframes pudar-masuk {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .lightbox figure {
        margin: 0;
        max-width: min(920px, 100%);
        cursor: default;
      }

      .lightbox img {
        display: block;
        max-width: 100%;
        max-height: 78vh;
        border-radius: var(--r-sedang);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
      }

      .lightbox figcaption {
        margin-top: 12px;
        text-align: center;
        font-family: var(--f-display);
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
      }

      .lightbox-tutup {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-size: 15px;
        transition: background 0.15s;
      }

      .lightbox-tutup:hover {
        background: rgba(255, 255, 255, 0.28);
      }

      .item-foto-tanda {
        font-size: 9px;
        color: var(--daun);
        margin-right: 2px;
      }

      /* =====================================================================
   Tombol
   ===================================================================== */

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: none;
        border-radius: var(--r-kecil);
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 600;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.1s;
        white-space: nowrap;
      }

      .btn:active:not(:disabled) {
        transform: scale(0.97);
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn i {
        font-size: 10.5px;
      }

      .btn--ok {
        background: var(--daun);
        color: #ffffff;
      }

      .btn--ok:hover:not(:disabled) {
        background: var(--daun-tua);
      }

      .btn--ghost {
        background: #f1f4f2;
        color: #45564b;
      }

      .btn--ghost:hover:not(:disabled) {
        background: #e4e9e6;
        color: var(--tinta);
      }

      .btn--danger {
        color: var(--bata);
      }

      .btn--danger:hover:not(:disabled) {
        background: #fdeaea;
        color: #b91c1c;
      }

      /* Tombol hantu di atas panel gelap perlu palet terbalik */
      .drawbar .btn--ghost {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.85);
      }

      .drawbar .btn--ghost:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
      }

      /* =====================================================================
   Panel daftar penanda
   ===================================================================== */

      .panel {
        background: var(--kertas);
        border-radius: var(--r-besar);
        box-shadow: var(--bayang-kartu);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 16px 16px 12px 16px;
        border-bottom: 1px solid var(--garis);
      }

      .panel-head h2 {
        font-family: var(--f-display);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0;
      }

      .panel-count {
        font-family: var(--f-data);
        font-size: 11px;
        font-weight: 500;
        color: var(--batu);
        background: #f1f4f2;
        padding: 2px 8px;
        border-radius: 999px;
      }

      .panel-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .panel-foot {
        display: flex;
        gap: 5px;
        padding: 10px;
        border-top: 1px solid var(--garis);
        background: #fafbfa;
      }

      .panel-foot .btn {
        flex: 1;
        padding: 8px 6px;
        font-size: 11.5px;
      }

      /* --- Keadaan kosong: ajakan bertindak, bukan sekadar pemberitahuan --- */
      .kosong {
        margin: auto;
        text-align: center;
        padding: 28px 18px;
      }

      .kosong-ikon {
        width: 46px;
        height: 46px;
        margin: 0 auto 12px auto;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #f1f4f2;
        color: var(--batu-muda);
        font-size: 17px;
      }

      .kosong p {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.55;
        color: var(--batu);
      }

      .kosong b {
        color: var(--tinta);
      }

      /* --- Baris penanda --- */
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 9px;
        border: none;
        background: transparent;
        border-radius: var(--r-sedang);
        text-align: left;
        transition: background 0.12s;
      }

      .item:hover {
        background: #f1f4f2;
      }

      .item-dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-size: 11px;
        flex-shrink: 0;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
      }

      .item-dot.is-terang {
        color: var(--tinta);
      }

      .item-teks {
        min-width: 0;
        flex: 1;
      }

      .item-nama {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--tinta);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-jenis {
        display: block;
        font-size: 10.5px;
        color: var(--batu-muda);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-hapus {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border: none;
        background: transparent;
        color: var(--batu-muda);
        border-radius: 7px;
        font-size: 11px;
        opacity: 0;
        transition:
          opacity 0.12s,
          background 0.12s,
          color 0.12s;
        flex-shrink: 0;
      }

      .item:hover .item-hapus,
      .item-hapus:focus-visible {
        opacity: 1;
      }

      .item-hapus:hover {
        background: #fdeaea;
        color: var(--bata);
      }

      /* =====================================================================
   Notifikasi
   ===================================================================== */

      .toasts {
        position: absolute;
        bottom: 62px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1100;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        pointer-events: none;
      }

      .toast {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 15px;
        background: var(--tinta);
        color: #ffffff;
        font-size: 12.5px;
        font-weight: 500;
        border-radius: 999px;
        box-shadow: var(--bayang-ambang);
        animation: naik 0.22s ease-out;
        pointer-events: auto;
      }

      .toast i {
        font-size: 11px;
        color: var(--daun);
      }

      .toast--gagal i {
        color: #f87171;
      }

      .toast-batal {
        border: none;
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 999px;
        margin-left: 2px;
      }

      .toast-batal:hover {
        background: rgba(255, 255, 255, 0.26);
      }

      .toast.is-pergi {
        animation: pudar 0.22s ease-in forwards;
      }

      @keyframes naik {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pudar {
        to {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      /* =====================================================================
   Poster Peta Potensi Desa
   ===================================================================== */

      .btn--poster {
        margin: 10px;
        padding: 11px;
        background: var(--kanopi);
        color: #ffffff;
        font-size: 12.5px;
      }

      .btn--poster:hover {
        background: var(--daun-tua);
      }

      .btn--poster i {
        color: var(--padi);
        font-size: 12px;
      }

      .poster-layar {
        position: fixed;
        inset: 0;
        z-index: 1500;
        background: #e7ebe8;
        display: flex;
        flex-direction: column;
        animation: pudar-masuk 0.2s ease-out;
      }

      .poster-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 14px;
        background: var(--tinta);
        flex-shrink: 0;
      }

      .poster-petunjuk {
        margin: 0 auto 0 0;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
      }

      .poster-bar .btn--ghost {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
      }

      .poster-bar .btn--ghost:hover {
        background: rgba(255, 255, 255, 0.22);
      }

      .poster-gulung {
        flex: 1;
        overflow: auto;
        padding: 20px;
        display: grid;
        place-items: center;
      }

      /* Poster diukur dalam milimeter, bukan piksel. Ukuran piksel diterjemahkan
   printer sesuka hatinya — hasilnya poster mengambang di tengah kertas
   dengan sepertiga halaman terbuang. Milimeter memetakan tepat ke kertas:
   404×281 mm = A3 lanskap dikurangi margin 8 mm. */
      .poster {
        position: relative;
        width: 404mm;
        height: 281mm;
        /* Warna penanda & legenda adalah isi peta, bukan hiasan — jangan
       dibuang printer saat mode hemat tinta */
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        flex-shrink: 0;
        display: grid;
        grid-template-columns: 54mm 1fr 54mm 78mm;
        gap: 3mm;
        padding: 4mm;
        background: #f6f7f5;
        border: 1.6mm solid #c9a227;
        box-shadow: 0 14px 50px rgba(6, 20, 12, 0.28);
      }

      .poster-kiri,
      .poster-kanan {
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        gap: 8px;
        min-height: 0;
        overflow: hidden;
      }

      .poster-tengah {
        position: relative;
        min-width: 0;
      }

      /* Panah utara & skala: tanpa keduanya, cetakan ini cuma gambar —
   bukan peta yang bisa dipakai mengukur dan mengorientasi diri */
      .poster-utara {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 42px;
        height: 56px;
        padding: 5px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid #2f4034;
        z-index: 600;
      }

      .poster .leaflet-control-scale {
        margin: 0 0 10px 10px;
      }

      .poster .leaflet-control-scale-line {
        border: 2px solid #22301f;
        border-top: none;
        background: rgba(255, 255, 255, 0.85);
        color: #22301f;
        font-family: var(--f-data);
        font-size: 9.5px;
        line-height: 1.2;
        padding: 2px 5px 1px;
        box-shadow: none;
      }

      .poster-peta {
        position: absolute;
        inset: 0;
        border: 2px solid #2f4034;
        background: #cfd8d2;
      }

      /* --- Kartu foto --- */
      .pp-kartu {
        position: relative;
        margin: 0;
        background: #ffffff;
        padding: 6px 6px 0 6px;
        border: 1px solid #d3dad5;
        box-shadow: 0 2px 8px rgba(6, 20, 12, 0.14);
      }

      .pp-kartu img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        background: #e4eae6;
      }

      .pp-kartu figcaption {
        padding: 5px 2px 6px 2px;
        font-size: 9.5px;
        font-weight: 700;
        line-height: 1.3;
        color: #2f4034;
        text-align: center;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .pp-kartu-nomor {
        position: absolute;
        top: -8px;
        left: -8px;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--kanopi);
        color: #ffffff;
        font-family: var(--f-data);
        font-size: 11px;
        font-weight: 500;
        border: 2px solid #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        z-index: 2;
      }

      .poster-kosong {
        margin: auto;
        font-size: 11px;
        line-height: 1.6;
        color: var(--batu);
        text-align: center;
      }

      /* --- Nomor pada penanda di peta poster --- */
      .pp-nomor {
        position: absolute;
        right: -6px;
        top: -6px;
        min-width: 17px;
        height: 17px;
        padding: 0 3px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: var(--kanopi);
        color: #ffffff;
        font-family: var(--f-data);
        font-size: 9.5px;
        border: 1.5px solid #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      }

      /* --- Tali penghubung kartu ke titik --- */
      .poster-tali {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 500;
      }

      /* Dua lapis lagi: putih tebal di bawah agar tali tetap terbaca saat
   melintasi citra satelit yang gelap */
      .pp-tali-bawah {
        fill: none;
        stroke: rgba(255, 255, 255, 0.92);
        stroke-width: 4.5;
      }

      /* Cukup tebal untuk tetap terbaca setelah dicetak — garis 1,4 px
   menghilang di atas kertas */
      .pp-tali {
        fill: none;
        stroke: #22301f;
        stroke-width: 2.2;
      }

      .pp-tali-titik {
        fill: #c9a227;
        stroke: #ffffff;
        stroke-width: 1.5;
      }

      /* --- Blok judul & legenda --- */
      .poster-blok {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border: 2px solid #2f4034;
        padding: 16px;
      }

      .poster-judul {
        font-family: var(--f-display);
        font-size: 19px;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: 0.01em;
        text-align: center;
        margin: 0;
        color: var(--kanopi);
      }

      .poster-sub {
        margin: 7px 0 0 0;
        font-size: 11px;
        text-align: center;
        color: #55655b;
      }

      [contenteditable]:hover {
        background: #f4f8f5;
        border-radius: 4px;
      }

      [contenteditable]:focus {
        outline: 2px solid var(--daun);
        outline-offset: 2px;
        border-radius: 4px;
        background: #ffffff;
      }

      .poster-garis-hias {
        height: 3px;
        margin: 14px 0;
        background: linear-gradient(90deg, var(--kanopi) 0 60%, #c9a227 60% 100%);
        flex-shrink: 0;
      }

      /* --- Peta inset --- */
      .poster-inset {
        flex-shrink: 0;
        margin-bottom: 14px;
      }

      #pInset {
        height: 150px;
        border: 1.5px solid #2f4034;
        background: #cfd8d2;
      }

      .poster-inset-ket {
        margin: 5px 0 0 0;
        font-size: 8.5px;
        line-height: 1.4;
        color: var(--batu);
        text-align: center;
      }

      .poster-legenda {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .poster-legenda h3 {
        margin: 0 0 10px 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #55655b;
      }

      .pp-legenda-baris {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 5px 0;
        border-bottom: 1px dotted #d3dad5;
      }

      .pp-legenda-dot {
        width: 21px;
        height: 21px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-size: 9px;
        flex-shrink: 0;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
      }

      .pp-legenda-dot.is-terang {
        color: var(--tinta);
      }

      .pp-legenda-teks {
        flex: 1;
        font-size: 11px;
        font-weight: 600;
        color: #2f4034;
      }

      .pp-legenda-jumlah {
        font-family: var(--f-data);
        font-size: 10px;
        color: var(--batu);
      }

      .poster-kaki {
        flex-shrink: 0;
        border-top: 2px solid var(--kanopi);
        padding-top: 10px;
        margin-top: 10px;
      }

      .poster-sumber {
        margin: 0;
        font-size: 9px;
        color: var(--batu-muda);
      }

      .poster-tim {
        margin: 6px 0 0 0;
        font-family: var(--f-display);
        font-size: 12px;
        font-weight: 700;
        color: var(--kanopi);
      }

      /* --- Cetak: hanya posternya, seukuran A3 lanskap --- */
      @page {
        size: A3 landscape;
        margin: 8mm;
      }

      @media print {
        body.mode-poster > *:not(.poster-layar) {
          display: none !important;
        }

        .poster-layar {
          position: static;
          background: #ffffff;
        }

        .poster-bar {
          display: none !important;
        }

        .poster-gulung {
          overflow: visible;
          padding: 0;
          display: block;
        }

        /* 1400×990 px ≈ 370×262 mm — sudah muat utuh di A3 lanskap
       (420×297 mm dikurangi margin 8 mm), jadi tidak perlu diskalakan. */
        .poster {
          box-shadow: none;
          margin: 0 auto;
        }

        [contenteditable]:hover {
          background: none;
        }

        /* Mesin cetak merasterkan bayangan berblur jadi kotak abu-abu pekat.
       Di kertas, garis tepi yang tegas lebih baik daripada bayangan. */
        .poster .penanda-badge,
        .pp-kartu,
        .pp-kartu-nomor,
        .pp-nomor,
        .pp-legenda-dot,
        .poster-blok {
          box-shadow: none !important;
        }

        .poster .penanda-ekor {
          filter: none !important;
        }

        .pp-kartu {
          border: 1px solid #b9c3bc;
        }
      }

      /* =====================================================================
   Tablet — panel pindah ke bawah peta
   ===================================================================== */

      @media (max-width: 900px) {
        .workspace {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(380px, 1fr) auto;
          height: auto;
          min-height: calc(100vh - 66px);
        }

        .panel-list {
          max-height: 224px;
        }

        .topbar-meta {
          display: none;
        }
      }

      /* =====================================================================
   Ponsel — dok jadi bar mendatar, gaya penanda jadi lembar bawah
   ===================================================================== */

      @media (max-width: 620px) {
        .topbar {
          padding: 12px 14px;
          gap: 12px;
        }

        .back span {
          display: none;
        }

        .back {
          padding: 9px 11px;
        }

        .brand h1 {
          font-size: 19px;
        }

        .workspace {
          padding: 10px;
          gap: 10px;
          /* Peta perlu tinggi ekstra: popup berfoto butuh ruang bernapas */
          grid-template-rows: minmax(420px, 68vh) auto;
        }

        /* Dok mendatar di bawah agar terjangkau ibu jari */
        .dock {
          top: auto;
          bottom: 12px;
          left: 50%;
          transform: translateX(-50%);
          flex-direction: row;
        }

        .dock-sep {
          width: 1px;
          height: auto;
          margin: 4px 2px;
        }

        .dock-body {
          flex-direction: row;
        }

        .dock-toggle {
          margin-bottom: 0;
          margin-right: 2px;
        }

        .dock.is-minim .dock-toggle {
          margin-right: 0;
        }

        .dock-toggle i {
          transform: rotate(-90deg);
        }

        .dock.is-minim .dock-toggle i {
          transform: rotate(90deg);
        }

        .dock-tip {
          left: 50%;
          top: auto;
          bottom: calc(100% + 10px);
          transform: translateX(-50%) translateY(4px);
        }

        .dock-btn:hover .dock-tip,
        .dock-btn:focus-visible .dock-tip {
          transform: translateX(-50%) translateY(0);
        }

        .dock-tip kbd {
          display: none;
        }

        /* Gaya penanda naik dari bawah, di atas dok. Tersembunyi sampai
       tombol gaya ditekan, supaya peta tetap lapang. */
        .styler {
          top: auto;
          bottom: 66px;
          left: 10px;
          right: 10px;
          width: auto;
          padding: 10px;
          animation: naik 0.18s ease-out;
        }

        .icon-grid {
          grid-template-columns: repeat(9, 1fr);
          gap: 4px;
        }

        .icon-btn {
          font-size: 12.5px;
        }

        .color-row {
          gap: 4px;
        }

        /* Popup harus muat di layar sempit tanpa mengorbankan fotonya */
        .pop-foto img {
          aspect-ratio: 16 / 9;
        }

        .leaflet-popup-scrolled {
          border: none !important;
        }

        .statusbar {
          top: 12px;
          bottom: auto;
          left: 12px;
          right: 12px;
          flex-direction: column;
          align-items: stretch;
          gap: 6px;
        }

        .status-hint {
          font-size: 11.5px;
          text-align: center;
        }

        .status-coord {
          display: none;
        }

        .drawbar {
          top: auto;
          bottom: 66px;
          width: calc(100% - 20px);
          justify-content: center;
          padding: 7px;
        }

        .toasts {
          bottom: 128px;
        }

        .panel-list {
          max-height: 190px;
        }
      }

      /* =====================================================================
   Hormati preferensi gerak minimal
   ===================================================================== */

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
